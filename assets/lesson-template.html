<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1c1f24;--mute:#6b727c;--line:#e7e4de;--acc:#2f5bd3;--acc2:#edf1fc;--ok:#1a7f43;--okbg:#e8f5ec;--no:#b42318;--nobg:#fcecea;--mark:#ffe98a}
@media (prefers-color-scheme:dark){:root{--bg:#141619;--card:#1d2025;--ink:#e9eaec;--mute:#9aa1ab;--line:#30343b;--acc:#8eaaff;--acc2:#222c44;--ok:#62d18e;--okbg:#17301f;--no:#ff8b80;--nobg:#3a1e1b;--mark:#5c4c00}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
a{color:var(--acc)}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px)}
.bar1{display:flex;align-items:center;gap:12px;padding:12px 0 8px}
.bar1 .t{font-weight:650;font-size:.92rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.switch{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--mute);cursor:pointer;white-space:nowrap}
.segs{display:flex;gap:3px;padding-bottom:10px}
.seg{flex:1;height:4px;border-radius:2px;background:var(--line);border:0;padding:0}
.seg.done{background:var(--acc)}.seg.cur{background:color-mix(in srgb,var(--acc) 40%,var(--line))}.seg.nav{cursor:pointer}
.hero{padding:22px 0 0}
h1{font-size:1.6rem;line-height:1.25;margin:0 0 8px}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;background:var(--acc2);color:var(--acc);font-weight:600;font-size:.76rem;margin:0 6px 6px 0}
.goals{margin:8px 0 0;padding-left:20px;color:var(--mute);font-size:.95rem}
section.step{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0}
body.paged section.step:not(.active){display:none}
.kicker{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
h2{font-size:1.25rem;margin:2px 0 2px}
.hint{color:var(--mute);font-size:.9rem;margin:0}
.block{margin-top:20px}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.label{font-size:.72rem;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
h3{font-size:1rem;margin:0 0 4px}
button,select{font:inherit;font-size:.88rem;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button.icon{width:34px;height:34px;padding:0;display:inline-grid;place-items:center;color:var(--mute)}
button.icon:hover,button.icon.on{color:var(--acc);border-color:var(--acc2);background:var(--acc2)}
button.icon.big{width:42px;height:42px;background:var(--acc);border-color:var(--acc);color:#fff}
button.say{border:0;background:none;padding:0 4px 0 0;color:var(--mute);vertical-align:-3px;border-radius:4px}button.say:hover{color:var(--acc)}
select{padding:5px 10px;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.player{display:flex;gap:8px;align-items:center;margin-top:16px}
.player audio{flex:1;min-width:0;height:40px}
ol.q{margin:0;padding-left:22px}ol.q li{margin:6px 0}
.ans{display:none;color:var(--ok);font-size:.93rem}
.show-ans .ans{display:block}
.text{margin-top:12px;padding:4px 0 4px 16px;border-left:3px solid var(--line)}
.text.hidden{display:none}
.text p{margin:4px -8px;padding:3px 8px;border-radius:8px;transition:background .15s}.text p:hover,.text p:focus-within{background:var(--acc2)}
.text p .say{visibility:hidden}.text p:hover .say,.text p:focus-within .say{visibility:visible}@media (hover:none){.text p .say{visibility:visible}}.spk{font-weight:650;margin-right:6px}.playing{background:var(--acc2);border-radius:4px}
.src{font-size:.8rem;color:var(--mute);margin-top:8px}
.kl{display:none;color:var(--mute);font-size:.9rem;margin-left:22px}.text.showko .kl,.kl.open{display:block}.tx.has{cursor:pointer}
.miss{border-bottom:1px solid var(--line);padding:8px 0;text-align:left}
.pq{font-size:1.05rem;margin:14px 0 10px}.lv{display:flex;gap:4px;align-items:center}.lv i{width:22px;height:4px;border-radius:2px;background:var(--line)}.lv i.on{background:var(--acc)}
.pr-btn{display:flex;justify-content:center;margin-top:18px}
mark{background:transparent;color:inherit;font-weight:650}.text mark{font-weight:inherit}
.hl mark{background:var(--mark);border-radius:3px;padding:0 2px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;vertical-align:top;border-bottom:1px solid var(--line);padding:7px 6px}
th{font-size:.68rem;text-transform:uppercase;color:var(--mute);letter-spacing:.05em;font-weight:700}
.ko{color:var(--mute)}.wrong{color:var(--no);text-decoration:line-through}.right{color:var(--ok);font-weight:600}
.ex-item{padding:10px 0;border-bottom:1px solid var(--line)}.ex-item:last-child{border-bottom:0}
.ex-item input[type=text],.ex-item textarea{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.ex-item input[type=text]{width:220px;max-width:100%}.ex-item textarea{flex:1;min-height:44px}
.opt{display:inline-flex;gap:5px;align-items:center;margin:4px 16px 0 0;cursor:pointer}
.fb{margin-top:6px;font-size:.92rem;display:none}
.fb.ok{display:block;color:var(--ok)}.fb.no{display:block;color:var(--no)}.fb.info{display:block;color:var(--ink)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:24px}
body:not(.paged) .foot{display:none}
.done-msg{text-align:center;padding:36px 10px}
.note{font-size:.8rem;color:var(--mute)}
@media print{header.top,.foot,button,select,.player{display:none!important}body.paged section.step{display:block!important}.text,.ans{display:block!important}}
</style>
</head>
