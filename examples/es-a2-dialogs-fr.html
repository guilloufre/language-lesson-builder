const LESSON = {"title": "Un piso en Madrid — ser y estar", "level": "A2", "lang": "es-ES", "l1": "fr", "topic": "Chercher un appartement", "grammar_point": "Ser et estar", "objectives": ["Comprendre une visite d'appartement et une conversation entre amis", "Choisir entre **ser** (identité, caractère, origine) et **estar** (lieu, état)", "Éviter les faux amis français → espagnol"], "dialogs": [{"title": "Visita del piso", "register": "Usted", "context": "Une agente immobilière fait visiter un appartement à un Français.", "speakers": [{"name": "Sra. Ruiz", "gender": "f"}, {"name": "Sr. Dupont", "gender": "m"}], "lines": [{"s": 0, "t": "Buenos días, señor Dupont. ¿**Es** usted francés?", "l1": "Bonjour, monsieur Dupont. Vous êtes français ?"}, {"s": 1, "t": "Sí, **soy** de Lyon, pero ahora **estoy** en Madrid por trabajo.", "l1": "Oui, je suis de Lyon, mais en ce moment je suis à Madrid pour le travail."}, {"s": 0, "t": "Muy bien. Mire, este piso **es** pequeño, pero **es** muy luminoso.", "l1": "Très bien. Regardez, cet appartement est petit, mais il est très lumineux."}, {"s": 1, "t": "¿Dónde **está** exactamente?", "l1": "Où se trouve-t-il exactement ?"}, {"s": 0, "t": "**Está** en el centro, cerca del metro Sol. La cocina **está** a la derecha.", "l1": "Il est dans le centre, près du métro Sol. La cuisine est à droite."}, {"s": 1, "t": "¿Cuántas habitaciones tiene?", "l1": "Il a combien de chambres ?"}, {"s": 0, "t": "Tiene dos habitaciones y un baño. Además, el salón **es** exterior: da a la calle.", "l1": "Il a deux chambres et une salle de bains. En plus, le salon est sur rue : il donne sur la rue."}, {"s": 1, "t": "¿Y el precio? ¿**Es** caro?", "l1": "Et le prix ? C'est cher ?"}, {"s": 0, "t": "**Son** novecientos euros al mes. Hoy el piso **está** un poco sucio, pero mañana **estará** limpio.", "l1": "C'est neuf cents euros par mois. Aujourd'hui l'appartement est un peu sale, mais demain il sera propre."}, {"s": 1, "t": "Perfecto. **Estoy** muy contento: me lo quedo.", "l1": "Parfait. Je suis très content : je le prends."}], "warmup": ["Avez-vous déjà cherché un appartement à l'étranger ? Qu'est-ce qui était difficile ?"], "q1": [{"q": "Qui parle et où sont-ils ?", "a": "Une agente immobilière et un client français, dans un appartement à Madrid."}, {"q": "Le client prend-il l'appartement ?", "a": "Oui (« me lo quedo »)."}, {"q": "Utilisent-ils *tú* ou *usted* ?", "a": "*Usted* (registre poli)."}], "q2": [{"q": "D'où vient M. Dupont et pourquoi est-il à Madrid ?", "a": "De Lyon ; il est à Madrid pour le travail."}, {"q": "Comment est l'appartement ?", "a": "Petit mais très lumineux, dans le centre près du métro Sol."}, {"q": "Combien coûte-t-il ?", "a": "900 euros par mois."}], "reading": [{"q": "Relevez les formes de *ser*. Que décrivent-elles ?", "a": "es, soy, es, es, es, es, son : nationalité, origine, caractéristiques (exterior), prix."}, {"q": "Relevez les formes de *estar*. Que décrivent-elles ?", "a": "estoy, está, está, está, estará, estoy : lieu et état temporaire (sale, content)."}], "notes": [{"t": "el piso", "l1": "l'appartement (Espagne)", "ex": "Busco un piso en el centro."}, {"t": "luminoso", "l1": "lumineux", "ex": "El salón es muy luminoso."}, {"t": "me lo quedo", "l1": "je le prends", "ex": "Me gusta el piso: me lo quedo."}, {"t": "al mes", "l1": "par mois", "ex": "Pago 700 euros al mes."}]}, {"title": "La mudanza", "register": "Tú", "context": "Lucía et Hugo, deux amis, parlent du nouvel appartement de Hugo.", "speakers": [{"name": "Lucía", "gender": "f"}, {"name": "Hugo", "gender": "m"}], "lines": [{"s": 0, "t": "¡Hugo! ¿Qué tal? ¿**Estás** cansado?", "l1": "Hugo ! Ça va ? Tu es fatigué ?"}, {"s": 1, "t": "Sí, **estoy** muerto. Hoy ha sido el día de la mudanza.", "l1": "Oui, je suis mort. Aujourd'hui, c'était le jour du déménagement."}, {"s": 0, "t": "¿Y cómo **es** tu nuevo piso?", "l1": "Et il est comment, ton nouvel appartement ?"}, {"s": 1, "t": "**Es** genial: **es** antiguo, pero **está** muy bien. **Está** en Lavapiés.", "l1": "Il est génial : il est ancien, mais il est en très bon état. Il est à Lavapiés."}, {"s": 0, "t": "¡Qué bien! ¿Y tus compañeros de piso? ¿Cómo **son**?", "l1": "Super ! Et tes colocataires ? Ils sont comment ?"}, {"s": 1, "t": "**Son** muy simpáticos. Uno **es** profesor y la otra **es** médica.", "l1": "Ils sont très sympas. L'un est prof et l'autre est médecin."}, {"s": 1, "t": "¿Y tú? ¿Cómo **estás**?", "l1": "Et toi ? Comment tu vas ?"}, {"s": 0, "t": "**Estoy** bien, pero mañana tengo un examen y **estoy** un poco nerviosa.", "l1": "Ça va, mais demain j'ai un examen et je suis un peu stressée."}, {"s": 0, "t": "¿Y tu habitación ya **está** lista?", "l1": "Et ta chambre est déjà prête ?"}, {"s": 1, "t": "Todavía no. **Está** llena de cajas. ¿Me ayudas el sábado?", "l1": "Pas encore. Elle est pleine de cartons. Tu m'aides samedi ?"}, {"s": 0, "t": "Claro. ¡Pero tú invitas a las tapas!", "l1": "Bien sûr. Mais c'est toi qui paies les tapas !"}], "q1": [{"q": "Comment va Hugo ? Pourquoi ?", "a": "Il est très fatigué : c'était le jour du déménagement."}, {"q": "Que demande Hugo à Lucía ?", "a": "De l'aider samedi."}], "q2": [{"q": "Comment est l'appartement de Hugo et où est-il ?", "a": "Ancien mais en bon état, à Lavapiés."}, {"q": "Que font ses colocataires ?", "a": "L'un est professeur, l'autre est médecin."}, {"q": "Pourquoi la chambre n'est-elle pas prête ?", "a": "Elle est pleine de cartons."}], "reading": [{"q": "Pourquoi « está lista » et pas « es lista » ?", "a": "*Estar listo* = être prêt (état) ; *ser listo* = être intelligent."}, {"q": "Trouvez une phrase avec *ser* et *estar* pour le même sujet.", "a": "« Es antiguo, pero está muy bien » : caractéristique (ser) / état (estar)."}], "notes": [{"t": "la mudanza", "l1": "le déménagement", "ex": "La mudanza es el sábado."}, {"t": "el compañero de piso", "l1": "le colocataire", "ex": "Tengo dos compañeros de piso."}, {"t": "estar muerto", "l1": "être crevé (fam.)", "ex": "Después del trabajo estoy muerto."}, {"t": "invitar", "l1": "offrir, payer (pour qqn)", "ex": "Hoy invito yo."}]}], "grammar": [{"family": "SER : ce que l'on est", "note": "Identité, origine, profession, caractéristiques, prix total.", "items": [{"form": "ser + origen", "mode": "de + lieu", "l1": "être de", "ex": "**Soy** de Lyon."}, {"form": "ser + profesión", "mode": "sans article", "l1": "être (métier)", "ex": "**Es** médica."}, {"form": "ser + descripción", "mode": "+ adjectif", "l1": "être (caractère, aspect)", "ex": "El piso **es** pequeño."}, {"form": "ser + precio total", "mode": "¿Cuánto es?", "l1": "ça fait / c'est", "ex": "**Son** 900 euros."}]}, {"family": "ESTAR : où et comment l'on est", "note": "Lieu, état passager, résultat d'un changement.", "items": [{"form": "estar + lugar", "mode": "en / cerca de…", "l1": "être (lieu), se trouver", "ex": "**Está** en el centro."}, {"form": "estar + estado", "mode": "+ adjectif", "l1": "être (état passager)", "ex": "**Estoy** cansado."}, {"form": "estar bien / mal", "mode": "+ adverbe", "l1": "être en bon / mauvais état", "ex": "El piso **está** muy bien."}]}], "vocab": [{"t": "el alquiler", "l1": "le loyer", "ex": "El alquiler es caro."}, {"t": "la habitación", "l1": "la chambre", "ex": "Mi habitación es grande."}, {"t": "la cocina", "l1": "la cuisine", "ex": "La cocina está a la izquierda."}, {"t": "limpio / sucio", "l1": "propre / sale", "ex": "Hoy el piso está sucio."}, {"t": "la caja", "l1": "le carton, la boîte", "ex": "Hay muchas cajas."}], "register": [{"formal": "¿Es usted francés?", "casual": "¿Eres francés?"}, {"formal": "Mire…", "casual": "Mira…"}, {"formal": "Buenos días.", "casual": "¿Qué tal?"}, {"formal": "¿Le ayudo?", "casual": "¿Te ayudo?"}], "culture": {"title": "Le « piso compartido »", "text": "À Madrid ou à Barcelone, beaucoup de jeunes actifs vivent en colocation (*piso compartido*). Dans les annonces, *exterior* signifie que les fenêtres donnent sur la rue (donc lumineux), *interior* qu'elles donnent sur une cour."}, "pitfalls": [{"title": "Un seul « être » en français, deux en espagnol", "explain": "Pour situer une chose ou une personne, on utilise **estar**, même si c'est permanent.", "l1": "Lieu → estar (mais un événement : « La fiesta es en mi casa »).", "wrong": "Madrid es en el centro de España.", "right": "Madrid **está** en el centro de España."}, {"title": "*Listo* change de sens", "explain": "Avec *ser* : intelligent. Avec *estar* : prêt.", "l1": "es listo = il est intelligent · está listo = il est prêt", "wrong": "La habitación es lista.", "right": "La habitación **está** lista."}, {"title": "Faux ami : *largo*", "explain": "*Largo* veut dire « long ». « Large » se dit *ancho*.", "l1": "largo = long · ancho = large", "wrong": "El salón es muy largo (= large).", "right": "El salón es muy **ancho**."}, {"title": "Faux ami : *embarazada*", "explain": "*Estar embarazada* veut dire « être enceinte », pas « être embarrassée ».", "l1": "gêné(e) = avergonzado/a", "wrong": "Estoy embarazada (= je suis gênée).", "right": "Estoy **avergonzada**."}], "speaking": [{"q": "Présentez-vous : origine, métier, où vous êtes en ce moment.", "a": "**Soy** francés, **soy** ingeniero y ahora **estoy** en Seúl."}, {"q": "Décrivez votre logement : comment il est et où il est.", "a": "Mi piso **es** pequeño pero luminoso. **Está** cerca del metro."}, {"q": "Comment allez-vous aujourd'hui ? Pourquoi ?", "a": "**Estoy** cansado porque he trabajado mucho. / **Estoy** contenta: hace sol."}], "exercises": [{"title": "Ser ou estar ?", "instruction": "Choisissez la bonne forme.", "type": "choice", "items": [{"q": "Mi piso ___ en el centro.", "options": ["es", "está"], "answers": ["está"], "explain": "lieu → estar"}, {"q": "Ana ___ médica.", "options": ["es", "está"], "answers": ["es"], "explain": "profession → ser"}, {"q": "Hoy ___ muy cansados.", "options": ["somos", "estamos"], "answers": ["estamos"], "explain": "état passager → estar"}, {"q": "Mis compañeros ___ simpáticos.", "options": ["son", "están"], "answers": ["son"], "explain": "caractère → ser"}, {"q": "La habitación ya ___ lista.", "options": ["es", "está"], "answers": ["está"], "explain": "estar listo = être prêt"}]}, {"title": "Conjuguez", "instruction": "Écrivez la bonne forme de *ser* ou *estar*.", "type": "fill", "items": [{"q": "Yo ___ de Lyon.", "answers": ["soy"]}, {"q": "¿Dónde ___ la cocina?", "answers": ["está"]}, {"q": "Nosotros ___ en Madrid por trabajo.", "answers": ["estamos"]}, {"q": "Tú ___ muy amable.", "answers": ["eres"]}, {"q": "Las cajas ___ en la habitación.", "answers": ["están"]}]}, {"title": "Dictée", "instruction": "Écoutez la phrase et écrivez-la (attention aux accents).", "type": "dictation", "items": [{"q": "Mi piso está en el centro."}, {"q": "Soy francés, pero estoy en Madrid."}, {"q": "Mis compañeros son muy simpáticos."}, {"q": "¿Dónde está la cocina?"}]}, {"title": "Traduisez", "instruction": "Traduisez en espagnol, puis comparez avec la correction.", "type": "free", "items": [{"q": "Je suis professeur et je suis fatigué.", "answers": ["Soy profesor y estoy cansado."]}, {"q": "L'appartement est petit, mais aujourd'hui il est propre.", "answers": ["El piso es pequeño, pero hoy está limpio."]}, {"q": "Où est le métro ?", "answers": ["¿Dónde está el metro?"]}, {"q": "Mes amis sont espagnols ; ils sont à Lyon.", "answers": ["Mis amigos son españoles; están en Lyon."]}]}], "audio_note": "Audio : voix du navigateur."};
